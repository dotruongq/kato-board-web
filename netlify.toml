[build]
  command = "npm run build"
  publish = "dist"

# Client-side routing: send every path to index.html so /pond/devices/... works on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Private site: also keep pictures and other files out of search results.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
